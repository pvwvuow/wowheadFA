name: fetch-news

# Poll Wowhead RSS every ~20 minutes; store new items as article JSONs.
#
# Reliability: GitHub's schedule cron is heavily delayed (or skipped) on
# low-activity repos, so this workflow keeps ITSELF alive: after every run
# (success or failure) it sleeps 20 minutes and fires a repository_dispatch
# ("fetch-loop") at itself using the workflow's own GITHUB_TOKEN —
# repository_dispatch is one of the few events that GITHUB_TOKEN is allowed
# to trigger, so no PAT is needed for the loop. The */20 schedule stays as a
# fallback in case the chain is ever broken (re-seed with one manual run).
#
# When new items are actually committed and pushed, the workflow also pings
# pvwvuow/wow (repository_dispatch "news-updated") using the NEWS_PING_TOKEN
# secret, so wow's static news pages rebuild instantly. If that secret is
# empty the step is skipped and wow falls back to its own schedule.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [fetch-loop]

permissions:
  contents: write
  actions: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new Wowhead news
        run: python tools/fetch_news.py
      - name: Commit new items + rebuild site (queue on Pages) + ping wow
        env:
          NEWS_PING_TOKEN: ${{ secrets.NEWS_PING_TOKEN }}
        run: |
          git config user.name "wowfarsi-bot"
          git config user.email "action@github.com"
          # the 20-min chain overlaps with its own next run (and the */20
          # schedule + other workflows also push); a bare `git push` here
          # raced and LOST the freshly published articles. On rejection:
          # merge origin/main in; same-path collisions (auto_state.json /
          # the same article written by two runs) resolve to OURS - the
          # newer writer - and docs are rebuilt from the merged data.
          safe_push() {
            local tries=0
            until git push origin HEAD:main; do
              tries=$((tries+1))
              if [ $tries -ge 4 ]; then
                echo "##[error]push failed after $tries tries"
                return 1
              fi
              echo "push rejected - merge origin/main + retry ($tries/4)"
              git fetch origin main
              if ! git merge --no-edit origin/main; then
                git checkout --ours . 2>/dev/null || true
                git add -A
                git commit --no-edit || { git merge --abort; return 1; }
              fi
              python tools/build_site.py
              git add docs
              git diff --cached --quiet || \
                git commit -m "site: rebuild after merge $(date -u +%FT%TZ)"
            done
          }
          # data/news-img MUST be committed together with the articles:
          # grab_images downloads into it and rewrites thumb to our Pages
          # URL - without this add the image files never landed in git
          # (they only made it in via the `git add -A` of a push-race
          # merge), so docs rebuilds 404ed and the discord bot posted
          # those articles with no image (owner report 2026-10-31).
          git add data/articles
          git add data/news-img 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new items."
          else
            git commit -m "news: fetch $(date -u +%FT%TZ)"
            pip install --quiet pillow
            python tools/build_site.py
            git add docs
            if ! git diff --cached --quiet; then
              git commit -m "site: rebuild after fetch $(date -u +%FT%TZ)"
            fi
            safe_push
            if [ -n "$NEWS_PING_TOKEN" ]; then
              code=$(curl -sS -o /tmp/ping.json -w "%{http_code}" -X POST \
                -H "Authorization: Bearer $NEWS_PING_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                https://api.github.com/repos/pvwvuow/wow/dispatches \
                -d '{"event_type":"news-updated"}')
              echo "ping pvwvuow/wow build-news: HTTP $code"
              cat /tmp/ping.json
            else
              echo "NEWS_PING_TOKEN not set — wow falls back to its own schedule"
            fi
          fi

  # ------------------------------------------------------------------
  # Auto-publish: the configured AI (AI_WRITER) writes a Persian article
  # for every queue item, a second reviewer call (AI_REVIEWER, temp 0)
  # returns severity-tagged problems: "block" = claim/number/name/date
  # not in the source (prevents publishing), "warn" = style/
  # translationese/ambiguous-date editorializing (logged only). The
  # 2..8 paragraph shape is enforced in code, never a rejection reason.
  # One rewrite is allowed; an item still rejected twice gets ONE
  # fallback attempt (Gemini writer + xAI reviewer, 6-minute cap,
  # max 2 tries on 5xx; FALLBACK_GEMINI=off disables). Rejected items
  # stay in the queue silently (Job Summary only). A 24h stats window
  # adds an aggregated report (pass rates, block/warn counts, avg time)
  # to the Job Summary once a day.
  # Config: secrets XAI_API_KEY / GEMINI_API_KEY (multi-key, ::add-mask::
  # per line) + variables AI_WRITER / AI_REVIEWER / XAI_MODEL /
  # GEMINI_MODEL / MAX_PER_RUN / MAX_PER_DAY / AUTO_PUBLISH /
  # FALLBACK_GEMINI.
  # ------------------------------------------------------------------
  auto-publish:
    needs: fetch
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Register API-key masks (multiline secrets are not auto-masked)
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/mask_keys.py
      - name: Write + review + publish queue items (AI)
        id: auto
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: ${{ vars.XAI_MODEL }}
          REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AI_WRITER: ${{ vars.AI_WRITER }}
          AI_REVIEWER: ${{ vars.AI_REVIEWER }}
          MAX_PER_RUN: ${{ vars.MAX_PER_RUN }}
          MAX_PER_DAY: ${{ vars.MAX_PER_DAY }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          FALLBACK_GEMINI: ${{ vars.FALLBACK_GEMINI }}
        run: python tools/auto_publish.py
      - name: Commit published articles + state, rebuild site, ping wow
        env:
          NEWS_PING_TOKEN: ${{ secrets.NEWS_PING_TOKEN }}
          PUBLISHED: ${{ steps.auto.outputs.published }}
        run: |
          git config user.name "wowfarsi-bot"
          git config user.email "action@github.com"
          # same race guard as the fetch job: merge origin/main + retry;
          # same-path collisions (auto_state.json / same article written by
          # two runs) keep OURS (the newer writer), then docs are rebuilt
          # from the merged data so Pages never goes stale
          safe_push() {
            local tries=0
            until git push origin HEAD:main; do
              tries=$((tries+1))
              if [ $tries -ge 4 ]; then
                echo "##[error]push failed after $tries tries"
                return 1
              fi
              echo "push rejected - merge origin/main + retry ($tries/4)"
              git fetch origin main
              if ! git merge --no-edit origin/main; then
                git checkout --ours . 2>/dev/null || true
                git add -A
                git commit --no-edit || { git merge --abort; return 1; }
              fi
              python tools/build_site.py
              git add docs
              git diff --cached --quiet || \
                git commit -m "site: rebuild after merge $(date -u +%FT%TZ)"
            done
          }
          git add data/articles
          git add data/news-img 2>/dev/null || true
          git add data/auto_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            pip install --quiet pillow
            python tools/build_site.py
            git add docs
            if ! git diff --cached --quiet; then
              git commit -m "auto-publish: $(date -u +%FT%TZ)"
              safe_push
            fi
            if [ "${PUBLISHED:-0}" -gt 0 ] 2>/dev/null; then
              git pull --rebase -q || true
              if [ -n "$NEWS_PING_TOKEN" ]; then
                code=$(curl -sS -o /tmp/ping.json -w "%{http_code}" -X POST \
                  -H "Authorization: Bearer $NEWS_PING_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  https://api.github.com/repos/pvwvuow/wow/dispatches \
                  -d '{"event_type":"news-updated"}')
                echo "ping pvwvuow/wow build-news: HTTP $code"
                cat /tmp/ping.json
              else
                echo "NEWS_PING_TOKEN not set — wow falls back to its own schedule"
              fi
            fi
          fi

  # Keep the 20-minute chain alive: after EVERY outcome (cancel excluded)
  # sleep 20 min and fire repository_dispatch "fetch-loop" at ourselves
  # using the workflow's own GITHUB_TOKEN (allowed for repository_dispatch).
  # Lives in its OWN job so it never delays fetch or auto-publish; the
  # */20 schedule stays as a fallback (re-seed = one manual dispatch).
  keepalive:
    needs: [fetch, auto-publish]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - name: Sleep 20m, then self-dispatch fetch-loop
        timeout-minutes: 24
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 1200
          code=$(curl -sS -o /tmp/loop.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"fetch-loop"}')
          echo "self-dispatch fetch-loop: HTTP $code"
          cat /tmp/loop.json
