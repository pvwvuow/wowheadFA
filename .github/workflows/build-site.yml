name: build-site

# Rebuild docs/ (GitHub Pages) whenever articles, config or tools change.
# QA gates must pass for every drafted/published article.
on:
  push:
    branches: [main]
    paths:
      - "data/articles/**"
      - "config/**"
      - "tools/build_site.py"
      - "tools/qa_check.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: QA gates
        run: python tools/qa_check.py --all
      - name: Install Pillow (news watermark)
        run: pip install --quiet pillow
      - name: Build site
        env:
          GSC_VERIFY_TOKEN: ${{ secrets.GSC_VERIFY_TOKEN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: python tools/build_site.py
      - name: Commit pages
        run: |
          git config user.name "wowfarsi-bot"
          git config user.email "action@github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No site changes."
          else
            git commit -m "site: build $(date -u +%FT%TZ)"
            git push
          fi
      - name: SEO ping (GSC sitemaps + Indexing API + IndexNow)
        env:
          GSC_SA_JSON: ${{ secrets.GSC_SA_JSON }}
          GSC_SITES: ${{ vars.GSC_SITES }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          pip install -q google-auth 2>/dev/null || true
          sleep 45   # let Pages deploy first so bots can fetch key/sitemaps
          python tools/seo_ping.py
          git config user.name "wowfarsi-bot"
          git config user.email "action@github.com"
          git pull --rebase -q || true
          git add data/seo_state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "seo: ping state $(date -u +%FT%TZ)"
            git push || echo "state push skipped (remote race); retried next run"
          fi
